    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <meta property="og:title" content="Aplikasi KUBOYAKO — RESMOB POLDA SULSEL" />

    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      // Auto-detect mobile device and redirect to kuboyako.com
      (function() {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        var isSmallScreen = window.innerWidth <= 768;
        var isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        // Check if already on kuboyako.com to prevent redirect loop
        var isOnKuboyako = window.location.hostname === 'kuboyako.com' || 
                          window.location.hostname === 'www.kuboyako.com';
        
        // Redirect mobile users to kuboyako.com
        if ((isMobile || (isSmallScreen && isTouchDevice)) && !isOnKuboyako) {
          window.location.href = 'https://www.kuboyako.com' + window.location.pathname + window.location.search;
        }
        
        // Set mobile attribute for CSS
        if (isMobile || isSmallScreen) {
          document.documentElement.setAttribute('data-mobile', 'true');
        }
      })();

      // 100% Adaptive Viewport Lock
      var setAdaptiveHeight = function() {
        document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
      };
      window.addEventListener('resize', setAdaptiveHeight);
      window.addEventListener('orientationchange', setAdaptiveHeight);
      setAdaptiveHeight();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var div = document.createElement('div');
        div.style = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:999999;padding:20px;font-family:monospace;white-space:pre-wrap;';
        div.innerText = 'Global Error: ' + message + '\n' + (error && error.stack ? error.stack : '');
        document.body.appendChild(div);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var div = document.createElement('div');
        div.style = 'position:fixed;top:0;left:0;width:100%;background:orange;color:black;z-index:999999;padding:20px;font-family:monospace;white-space:pre-wrap;';
        div.innerText = 'Unhandled Promise Rejection: ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason);
        document.body.appendChild(div);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
